<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yazılım Portföyü</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #f8fefb 100%);
            color: #1f2937;
            min-height: 100vh;
            overflow-x: hidden;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(34, 197, 94, 0.1);
            box-shadow: 0 4px 6px rgba(34, 197, 94, 0.05);
            animation: slideDown 0.6s ease-out;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        .lang-toggle {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .lang-btn {
            padding: 0.6rem 1.2rem;
            border: 1.5px solid rgba(34, 197, 94, 0.2);
            background: rgba(34, 197, 94, 0.05);
            color: #059669;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .lang-btn:hover {
            border-color: rgba(34, 197, 94, 0.4);
            transform: translateY(-2px);
            background: rgba(34, 197, 94, 0.1);
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            padding: 2rem 5%;
            text-align: center;
            animation: fadeInUp 1s ease-out 0.2s both;
            position: relative;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-content h1 {
            font-size: 4rem;
            line-height: 1.2;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: #4b5563;
            margin-bottom: 2rem;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .cv-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
            margin-bottom: 2rem;
        }

        .cv-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(16, 185, 129, 0.4);
            color: #ffffff;
        }

        .cv-btn i {
            font-size: 1.2rem;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            color: #10b981;
            font-size: 1.5rem;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(10px); }
        }

        .projects-section {
            padding: 5rem 5%;
            background: linear-gradient(135deg, #f0fdf4 0%, #f0fdf4 100%);
        }

        .section-title {
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -0.5px;
            animation: fadeInUp 1s ease-out;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .project-card {
            background: #fff;
            border: 1.5px solid rgba(16, 185, 129, 0.15);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            animation: fadeInUp 0.8s ease-out both;
            position: relative;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.08);
        }

        .project-card:hover {
            transform: translateY(-12px);
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 16px 32px rgba(16, 185, 129, 0.15);
        }

        .project-image {
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            position: relative;
            overflow: hidden;
            object-fit: cover; 
            padding: 10px;
        }

        .project-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .project-info {
            padding: 1.5rem;
        }

        .project-info h3 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #1f2937;
            font-weight: 700;
        }

        .project-info p {
            font-size: 0.95rem;
            color: #6b7280;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tech-tag {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tech-tag:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.5);
        }

        .more-projects {
            text-align: center;
            margin-top: 4rem;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .github-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            padding: 1rem 2.5rem;
            background: #1f2937;
            color: #ffffff;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(31, 41, 55, 0.15);
        }

        .github-btn:hover {
            transform: translateY(-5px);
            background: #10b981;
            box-shadow: 0 15px 25px rgba(16, 185, 129, 0.3);
        }
        
        .github-btn i {
            font-size: 1.4rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
            backdrop-filter: blur(4px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #fff;
            border: 1.5px solid rgba(16, 185, 129, 0.2);
            border-radius: 20px;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            animation: slideUp 0.4s cubic-bezier(0.23, 1, 0.320, 1);
            box-shadow: 0 25px 50px rgba(16, 185, 129, 0.15);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1.5rem;
            border-bottom: 1.5px solid rgba(16, 185, 129, 0.1);
            padding-bottom: 1rem;
        }

        .modal-header h2 {
            font-size: 2rem;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .close-btn {
            background: rgba(16, 185, 129, 0.1);
            border: none;
            color: #059669;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .close-btn:hover {
            color: #fff;
            background: #10b981;
            transform: rotate(90deg);
        }

        .modal-body {
            display: grid;
            gap: 1.5rem;
        }

        .modal-image {
            width: 100%;
            height: 300px;
            background: #ffffff;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .modal-img-inner {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            border-radius: 15px;
            padding: 10px; 
        }

        .modal-section {
            display: grid;
            gap: 0.5rem;
        }

        .modal-section h3 {
            color: #10b981;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        .modal-section p {
            color: #4b5563;
            line-height: 1.7;
            font-size: 0.95rem;
        }

        .tech-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .tech-stack span {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            border: 1px solid rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .modal-links {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .modal-btn {
            padding: 0.9rem 1.8rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .modal-btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .modal-btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(16, 185, 129, 0.35);
        }

        footer {
            text-align: center;
            padding: 3rem 5%;
            border-top: 1.5px solid rgba(16, 185, 129, 0.1);
            color: #6b7280;
            margin-top: 3rem;
            background: rgba(16, 185, 129, 0.02);
        }

        footer p {
            font-size: 0.9rem;
            margin: 0.5rem 0;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .social-links a {
            color: #10b981;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            text-decoration: none;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.1);
        }

        .social-links a:hover {
            color: #fff;
            background: #10b981;
            transform: translateY(-3px);
        }

        @media (max-width: 768px) {
            nav { padding: 1rem 4%; }
            .hero-content h1 { font-size: 2.5rem; }
            .hero-content p { font-size: 1.1rem; margin-bottom: 1.5rem; }
            .cv-btn { padding: 0.8rem 2rem; font-size: 1rem; }
            .section-title { font-size: 2rem; }
            .projects-grid { grid-template-columns: 1fr; }
            .project-image { object-fit: contain !important; }
            .modal-content { padding: 1.5rem; }
            .modal-header h2 { font-size: 1.5rem; }
            .github-btn {
                width: 100%;
                font-size: 1rem;
                padding: 0.8rem 1.5rem;
            }
        }
    </style>
</head>

                descriptionEn: 'N8N integrated solutions: Implementing the idea of ​​selling AI and spatially-aided software with Kotlin.',
                technologies: ['Kotlin','N8N','Gemini','Google SDK'],
                features: 'Kişiselleştirilebilir konum uzaklık ayarı, birden fazla satış fikri, gelişmiş gemini yapay zeka',
                featuresEn: 'Customizable location distance setting, multiple sales ideas, advanced Gemini AI.',
                github: 'https://github.com/mertdemirci04/FindSoftJob',
            },
            
        ];

        let currentLanguage = 'tr';

        function initProjects() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = '';
            
            projectsData.forEach(project => {
                const projectName = currentLanguage === 'tr' ? project.name : project.nameEn;
                const card = document.createElement('div');
                card.className = 'project-card';
                
                const imageContent = project.image 
                    ? `<img src="${project.image}" alt="${projectName}" class="project-image">`
                    : `<div class="project-image">${project.icon || '🚀'}</div>`;

                card.innerHTML = `
                    ${imageContent}
                    <div class="project-info">
                        <h3>${projectName}</h3>
                        <p>${currentLanguage === 'tr' 
                            ? project.description.substring(0, 80) + '...' 
                            : project.descriptionEn.substring(0, 80) + '...'}</p>
                        <div class="tech-tags">
                            ${project.technologies.slice(0, 3).map(tech => 
                                `<span class="tech-tag">${tech}</span>`
                            ).join('')}
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', () => openModal(project));
                grid.appendChild(card);
            });
        }

        function openModal(project) {
            const modal = document.getElementById('projectModal');
            const projectName = currentLanguage === 'tr' ? project.name : project.nameEn;
            const description = currentLanguage === 'tr' ? project.description : project.descriptionEn;
            const features = currentLanguage === 'tr' ? project.features : project.featuresEn;
            
            document.getElementById('modalTitle').textContent = projectName;
            
            const modalImageContainer = document.getElementById('modalImage');
            if (project.image) {
                modalImageContainer.innerHTML = `<img src="${project.image}" alt="${projectName}" class="modal-img-inner">`;
            } else {
                modalImageContainer.innerHTML = project.icon || '🚀';
            }

            document.getElementById('modalDescription').textContent = description;
            document.getElementById('modalFeatures').textContent = features;
            
            const techStack = document.getElementById('modalTech');
            techStack.innerHTML = project.technologies
                .map(tech => `<span>${tech}</span>`)
                .join('');
            
            document.getElementById('githubLink').href = project.github;
            
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('projectModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function changeLanguage(lang) {
            currentLanguage = lang;
            
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-lang="${lang}"]`).classList.add('active');
            
            const t = translations[lang];
            document.getElementById('heroSubtitle').textContent = t.heroSubtitle;
            document.getElementById('cvBtnText').textContent = t.cvBtnText;
            document.getElementById('projectsTitle').textContent = t.projectsTitle;
            document.getElementById('footerText').textContent = t.footerText;
            document.getElementById('descLabel').textContent = t.descLabel;
            document.getElementById('techLabel').textContent = t.techLabel;
            document.getElementById('featuresLabel').textContent = t.featuresLabel;
            document.getElementById('linksLabel').textContent = t.linksLabel;
            document.getElementById('githubText').textContent = t.githubText;
            document.getElementById('moreGithubText').textContent = t.moreGithubText;
            
            initProjects();
        }

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                changeLanguage(e.target.dataset.lang);
            });
        });

        document.getElementById('projectModal').addEventListener('click', (e) => {
            if (e.target.id === 'projectModal') {
                closeModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        window.addEventListener('load', () => {
            initProjects();
            
            const userName = 'Mert Demirci'; 
            document.getElementById('heroName').textContent = userName;
        });
    </script>
</body>
</html>
